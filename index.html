<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0d15">
<title>BlockPop</title>
<style>
/* ══════════════════════════════════════════════════════════════
   BlockPop — all styles in one file
   ══════════════════════════════════════════════════════════════ */

*,
*::before,
*::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --bg-0: #0a0d15;
  --bg-1: #141a2a;
  --accent: #4ea8ff;
  --accent-2: #22d3ee;
  --text: #e8ecf5;
  --text-dim: #6d7893;
  --text-mid: #8e9bb8;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: radial-gradient(120% 90% at 50% 0%, #1d2333 0%, #0d1017 60%, #080a0f 100%);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-user-select: none;
  user-select: none;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  min-height: 100dvh;
  padding: 14px;
  overflow: hidden;
}

#bgCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

.screen-hidden { display: none !important; }

/* ══════════════════════════════════════════════════════════════
   HOME SCREEN
   ══════════════════════════════════════════════════════════════ */

.home {
  position: relative;
  z-index: 1;
  width: min(92vw, 420px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 26px;
  text-align: center;
  animation: fadeUp .7s cubic-bezier(.2, .9, .3, 1.1) both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}

.logo {
  margin: 0;
  font-size: clamp(48px, 15vw, 76px);
  font-weight: 900;
  letter-spacing: -.03em;
  line-height: .95;
  background: linear-gradient(180deg, #ffffff 0%, #b9c9e6 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 6px 26px rgba(78, 168, 255, .35));
}

.logo span {
  background: linear-gradient(135deg, #7fd4ff 0%, #4ea8ff 45%, #a78bfa 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.tagline {
  margin: -14px 0 4px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .35em;
  text-transform: uppercase;
  color: var(--text-dim);
}

.menu {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.menu-btn {
  position: relative;
  display: flex;
  align-items: center;
  gap: 16px;
  width: 100%;
  padding: 18px 20px;
  border: none;
  border-radius: 20px;
  font: inherit;
  text-align: left;
  text-decoration: none;
  color: var(--text);
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  background: linear-gradient(160deg, rgba(255, 255, 255, .09), rgba(255, 255, 255, .03));
  box-shadow:
    0 14px 34px rgba(0, 0, 0, .45),
    inset 0 0 0 1px rgba(255, 255, 255, .07);
  transition: transform .18s cubic-bezier(.2, .9, .3, 1.4),
              box-shadow .18s ease;
  overflow: hidden;
}

.menu-btn::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, .12) 50%, transparent 70%);
  transform: translateX(-120%);
  transition: transform .7s ease;
  pointer-events: none;
}

.menu-btn:hover::after { transform: translateX(120%); }

.menu-btn:hover {
  transform: translateY(-3px) scale(1.015);
  box-shadow:
    0 18px 40px rgba(0, 0, 0, .55),
    inset 0 0 0 1px rgba(255, 255, 255, .14);
}

.menu-btn:active { transform: translateY(0) scale(.99); }

.menu-btn.classic   { background-image: linear-gradient(160deg, rgba(78, 168, 255, .22), rgba(34, 211, 238, .07)); }
.menu-btn.adventure { background-image: linear-gradient(160deg, rgba(167, 139, 250, .22), rgba(244, 114, 182, .07)); }

.menu-icon {
  flex: 0 0 48px;
  height: 48px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  font-size: 24px;
  font-weight: 800;
  background: rgba(255, 255, 255, .07);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .1);
}

.classic   .menu-icon { color: #7fd4ff; text-shadow: 0 0 18px rgba(78, 168, 255, .8); }
.adventure .menu-icon { color: #d8c4ff; text-shadow: 0 0 18px rgba(167, 139, 250, .8); }

.menu-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 3px;
}

.menu-title {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: .01em;
}

.menu-sub {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--text-dim);
}

.menu-arrow {
  font-size: 26px;
  color: var(--text-dim);
  transition: transform .18s ease;
}

.menu-btn:hover .menu-arrow { transform: translateX(4px); color: var(--text); }

.home-foot {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-top: 6px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text-dim);
}
/* ══════════════════════════════════════════════════════════════
   GAME SCREEN — LAYOUT
   ══════════════════════════════════════════════════════════════ */

.app {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: min(94vw, 440px);
  animation: fadeUp .5s cubic-bezier(.2, .9, .3, 1.1) both;
}

/* ── Top bar ─────────────────────────────────────────────── */

.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 4px;
}

.back-btn {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  padding: 0;
  border: none;
  border-radius: 12px;
  font: inherit;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  color: var(--text);
  background: rgba(255, 255, 255, .06);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .07);
  transition: background .15s ease, transform .12s ease;
}

.back-btn:hover  { background: rgba(255, 255, 255, .12); }
.back-btn:active { transform: scale(.93); }

.mode-title {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--text-mid);
}

.topbar-spacer { flex: 1; }

/* ── HUD ─────────────────────────────────────────────────── */

.hud {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding: 0 6px;
}

.stat { display: flex; flex-direction: column; gap: 2px; }
.stat.right { align-items: flex-end; }

.label {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .2em;
  color: var(--text-dim);
}

.value {
  font-size: 27px;
  font-weight: 800;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  background: linear-gradient(180deg, #ffffff, #9fb0d0);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* ── Progress bar (adventure) ────────────────────────────── */

.progress-bar {
  height: 7px;
  margin: 0 6px;
  border-radius: 99px;
  background: rgba(255, 255, 255, .06);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .04);
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 99px;
  background: linear-gradient(90deg, #22d3ee, #4ea8ff 60%, #a78bfa);
  box-shadow: 0 0 14px rgba(78, 168, 255, .7);
  transition: width .45s cubic-bezier(.2, .9, .3, 1);
}

/* ══════════════════════════════════════════════════════════════
   BOARD
   ══════════════════════════════════════════════════════════════ */

.board-frame {
  background: linear-gradient(180deg, #1a2030, #151a27);
  border-radius: 20px;
  padding: 9px;
  box-shadow:
    0 18px 40px rgba(0, 0, 0, .55),
    0 0 0 1px rgba(255, 255, 255, .05),
    inset 0 1px 0 rgba(255, 255, 255, .06);
}

.board-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
}

.board {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 5px;                 /* must match GAP in JS */
  width: 100%;
  height: 100%;
  touch-action: none;
}

.fx-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 5;
}

.cell {
  border-radius: 6px;
  background: #222839;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .03);
  transition: background-color .1s ease;
}

.cell.filled {
  background: var(--c);
  box-shadow:
    inset 0 3px 0 rgba(255, 255, 255, .30),
    inset 0 -4px 0 rgba(0, 0, 0, .28),
    0 0 10px -2px var(--c);
}

.cell.preview {
  background: var(--pc);
  opacity: .45;
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .55);
}

.cell.clearing {
  animation: pop .24s ease-out forwards;
}

@keyframes pop {
  0%   { transform: scale(1);    filter: brightness(1); }
  45%  { transform: scale(1.2);  filter: brightness(2); }
  100% { transform: scale(0);    opacity: 0; }
}
/* ══════════════════════════════════════════════════════════════
   TRAY
   ══════════════════════════════════════════════════════════════ */

.tray {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  touch-action: none;
}

.slot {
  height: 86px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 16px;
  background: rgba(255, 255, 255, .035);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .04);
}

.piece {
  display: grid;
  cursor: grab;
  touch-action: none;
  transition: transform .13s ease;
}

.piece:hover  { transform: scale(1.08); }
.piece:active { cursor: grabbing; }

.piece .b,
.drag-piece .b {
  border-radius: 6px;
  background: var(--c);
  box-shadow:
    inset 0 3px 0 rgba(255, 255, 255, .32),
    inset 0 -4px 0 rgba(0, 0, 0, .3),
    0 0 10px -3px var(--c);
}

.piece .b { border-radius: 4px; }

/* ── Dragged piece ───────────────────────────────────────── */

.drag-piece {
  position: fixed;
  display: grid;
  pointer-events: none;
  z-index: 999;
  left: 0;
  top: 0;
  filter: drop-shadow(0 14px 20px rgba(0, 0, 0, .65));
  animation: grab .12s ease-out;
}

@keyframes grab {
  from { transform: scale(.82); opacity: .6; }
  to   { transform: scale(1);   opacity: 1; }
}

.drag-piece.locked {
  filter:
    drop-shadow(0 0 14px rgba(255, 255, 255, .45))
    drop-shadow(0 12px 16px rgba(0, 0, 0, .55));
}

/* ══════════════════════════════════════════════════════════════
   SCORE POPUP
   ══════════════════════════════════════════════════════════════ */

.score-popup {
  position: fixed;
  pointer-events: none;
  z-index: 1200;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: .02em;
  color: #ffffff;
  text-shadow:
    0 2px 10px rgba(0, 0, 0, .7),
    0 0 24px rgba(120, 200, 255, .9);
  animation: scorePop .95s cubic-bezier(.2, .9, .3, 1) forwards;
}

@keyframes scorePop {
  0%   { transform: translate(-50%, 0)     scale(.5); opacity: 0; }
  22%  { transform: translate(-50%, -14px) scale(1.25); opacity: 1; }
  100% { transform: translate(-50%, -70px) scale(1);   opacity: 0; }
}

/* ══════════════════════════════════════════════════════════════
   OVERLAY
   ══════════════════════════════════════════════════════════════ */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 1100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(6, 8, 13, .76);
  backdrop-filter: blur(9px);
  -webkit-backdrop-filter: blur(9px);
  transition: opacity .28s ease;
}

.overlay.hidden {
  opacity: 0;
  pointer-events: none;
}

.panel {
  text-align: center;
  padding: 30px 38px;
  border-radius: 22px;
  background: linear-gradient(180deg, #1d2434, #161b28);
  box-shadow:
    0 24px 60px rgba(0, 0, 0, .65),
    inset 0 0 0 1px rgba(255, 255, 255, .08);
  animation: rise .34s cubic-bezier(.2, .9, .3, 1.4);
}

@keyframes rise {
  from { transform: scale(.85) translateY(16px); opacity: 0; }
  to   { transform: scale(1)   translateY(0);    opacity: 1; }
}

.panel h2 {
  margin: 0 0 8px;
  font-size: 25px;
  font-weight: 800;
  letter-spacing: .01em;
}

.final {
  margin: 0 0 22px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--text-mid);
}

.final span {
  display: block;
  margin-top: 8px;
  font-size: 40px;
  font-weight: 900;
  letter-spacing: 0;
  color: #fff;
  text-shadow: 0 0 24px rgba(120, 200, 255, .55);
}

.panel-buttons {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.btn-primary {
  font: inherit;
  font-weight: 800;
  font-size: 14px;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 13px 36px;
  border: none;
  border-radius: 14px;
  color: #08111f;
  background: linear-gradient(180deg, #7fd4ff, #3aa9ff);
  box-shadow: 0 6px 0 #1f6fb3, 0 12px 24px rgba(58, 169, 255, .38);
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  transition: transform .08s, box-shadow .08s;
}

.btn-primary:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #1f6fb3, 0 6px 14px rgba(58, 169, 255, .32);
}

.btn-link {
  font: inherit;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--text-dim);
  background: none;
  border: none;
  padding: 4px 8px;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  transition: color .15s ease;
}

.btn-link:hover { color: var(--text); }

/* ══════════════════════════════════════════════════════════════
   RESPONSIVE
   ══════════════════════════════════════════════════════════════ */

@media (max-height: 720px) {
  .slot { height: 72px; }
  .hud .value { font-size: 23px; }
  .app { gap: 9px; }
}

@media (max-height: 620px) {
  .slot { height: 60px; }
  .logo { font-size: 52px; }
}
</style>
</head>
<body class="home-page">

<canvas id="bgCanvas"></canvas>

<!-- ══════════════════ HOME SCREEN ══════════════════ -->
<main class="home" id="homeScreen">
  <h1 class="logo">Block<span>Pop</span></h1>
  <p class="tagline">Drop &middot; Match &middot; Blast</p>

  <nav class="menu">
    <button class="menu-btn classic" data-mode="classic">
      <span class="menu-icon">&#8734;</span>
      <span class="menu-body">
        <span class="menu-title">Classic</span>
        <span class="menu-sub">Endless mode</span>
      </span>
      <span class="menu-arrow">&#8250;</span>
    </button>

    <button class="menu-btn adventure" data-mode="adventure">
      <span class="menu-icon">&#9733;</span>
      <span class="menu-body">
        <span class="menu-title">Adventure</span>
        <span class="menu-sub">Puzzle levels</span>
      </span>
      <span class="menu-arrow">&#8250;</span>
    </button>
  </nav>

  <footer class="home-foot">
    <span id="homeBest">Best Score: 0</span>
    <span id="homeLevel">Adventure Level 1</span>
  </footer>
</main>

<!-- ══════════════════ GAME SCREEN ══════════════════ -->
<div class="app screen-hidden" id="gameScreen">
  <header class="topbar">
    <button class="back-btn" id="backBtn" aria-label="Back to home">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
           stroke="currentColor" stroke-width="2.6"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
    <span class="mode-title" id="modeTitle">Classic</span>
    <span class="topbar-spacer"></span>
  </header>

  <div class="hud">
    <div class="stat">
      <span class="label">SCORE</span>
      <span class="value" id="score">0</span>
    </div>
    <div class="stat right">
      <span class="label" id="rightLabel">BEST</span>
      <span class="value" id="rightValue">0</span>
    </div>
  </div>

  <div class="progress-bar screen-hidden" id="progressBar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="board-frame">
    <div class="board-wrap">
      <div class="board" id="board"></div>
      <canvas class="fx-canvas" id="fxCanvas"></canvas>
    </div>
  </div>

  <div class="tray" id="tray"></div>
</div>

<!-- ══════════════════ OVERLAY ══════════════════ -->
<div class="overlay hidden" id="overlay">
  <div class="panel">
    <h2 id="overTitle">Game Over</h2>
    <p class="final">Score <span id="finalScore">0</span></p>
    <div class="panel-buttons">
      <button class="btn-primary" id="restart">Play Again</button>
      <button class="btn-link" id="homeBtn">Home</button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   BlockPop — single-file offline game engine
   Handles: home screen, classic mode, adventure mode
   ══════════════════════════════════════════════════════════════ */

(function () {
  'use strict';

  /* ══════════════════════════════════════════════════════════
     ALGORITHM CONFIG
     ══════════════════════════════════════════════════════════ */

  const ALGO = {
    difficulty: 'normal',        // 'easy' | 'normal' | 'hard'
    guaranteePlayable: true,
    varietyPenalty: true,
    boardFillSensitivity: 1.0
  };

  /* ══════════════════════════════════════════════════════════
     SCORE CONFIG
     ══════════════════════════════════════════════════════════ */

  const SCORE = {
    pointsPerBlock: 10,
    lineBase: 100,
    lineCombo: 50
  };

  /* ══════════════════════════════════════════════════════════
     AUDIO ENGINE
     ══════════════════════════════════════════════════════════ */

  const Sfx = (function () {
    let ctx = null;

    function get() {
      if (!ctx) {
        try {
          ctx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
          return null;
        }
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }

    function tone(freq, dur, type, vol, delay) {
      const c = get();
      if (!c) return;
      const t = c.currentTime + (delay || 0);
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain).connect(c.destination);
      osc.start(t);
      osc.stop(t + dur + 0.06);
    }

    function noise(dur, vol, cutoff) {
      const c = get();
      if (!c) return;
      const len = Math.floor(c.sampleRate * dur);
      const buf = c.createBuffer(1, len, c.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        const decay = 1 - i / len;
        data[i] = (Math.random() * 2 - 1) * decay * decay;
      }
      const src = c.createBufferSource();
      src.buffer = buf;
      const filter = c.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = cutoff || 2500;
      const gain = c.createGain();
      gain.gain.value = vol || 0.07;
      src.connect(filter).connect(gain).connect(c.destination);
      src.start();
    }

    return {
      unlock() { get(); },
      pickup() { tone(520, 0.06, 'sine', 0.07); },
      place()  { tone(320, 0.09, 'triangle', 0.1); },
      invalid(){ tone(140, 0.11, 'sawtooth', 0.05); },
      clear(n) {
        const steps = Math.min(n, 4);
        for (let i = 0; i < steps; i++) {
          tone(440 * Math.pow(1.26, i), 0.28, 'sine', 0.12, i * 0.07);
        }
        noise(0.3, 0.05, 4200);
      },
      gameOver() {
        tone(420, 0.28, 'sine', 0.13);
        tone(310, 0.28, 'sine', 0.13, 0.16);
        tone(200, 0.5, 'sine', 0.13, 0.32);
      },
      levelUp() {
        [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
          tone(f, 0.3, 'triangle', 0.13, i * 0.1);
        });
      }
    };
  })();

  /* ══════════════════════════════════════════════════════════
     ANIMATED BACKGROUND
     ══════════════════════════════════════════════════════════ */

  function initBackground() {
    const canvas = document.getElementById('bgCanvas');
    if (!canvas) return;

    const ctx = canvas.getContext('2d');
    const COLORS = ['#4ea8ff', '#3ddc97', '#ffd166', '#ff6b6b',
                    '#c084fc', '#f472b6', '#22d3ee', '#fb923c'];
    const blocks = [];
    let w = 0, h = 0, dpr = 1;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    const count = Math.min(28, Math.max(12, Math.floor((w * h) / 42000)));
    for (let i = 0; i < count; i++) {
      blocks.push({
        x: Math.random() * w,
        y: Math.random() * h,
        size: 12 + Math.random() * 36,
        vy: 0.15 + Math.random() * 0.5,
        vx: (Math.random() - 0.5) * 0.25,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.012,
        color: COLORS[(Math.random() * COLORS.length) | 0],
        alpha: 0.05 + Math.random() * 0.09
      });
    }

    function draw() {
      ctx.clearRect(0, 0, w, h);
      for (let i = 0; i < blocks.length; i++) {
        const b = blocks[i];
        b.y += b.vy;
        b.x += b.vx;
        b.rot += b.vr;

        if (b.y - b.size > h) { b.y = -b.size; b.x = Math.random() * w; }
        if (b.x < -b.size) b.x = w + b.size;
        else if (b.x > w + b.size) b.x = -b.size;

        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.rot);
        ctx.globalAlpha = b.alpha;
        ctx.fillStyle = b.color;
        const s = b.size;
        const r = s * 0.22;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(-s / 2, -s / 2, s, s, r);
        else ctx.rect(-s / 2, -s / 2, s, s);
        ctx.fill();
        ctx.restore();
      }
      requestAnimationFrame(draw);
    }
    draw();
  }

  /* ══════════════════════════════════════════════════════════
     PARTICLE SYSTEM
     ══════════════════════════════════════════════════════════ */

  function ParticleSystem(canvas) {
    const ctx = canvas.getContext('2d');
    const particles = [];
    let dpr = 1, w = 0, h = 0, raf = null;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      if (rect.width === 0) return;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = rect.width;
      h = rect.height;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function burst(x, y, color, count) {
      const n = count || 10;
      for (let i = 0; i < n; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4.5;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.5,
          radius: 1.5 + Math.random() * 3.5,
          life: 1,
          decay: 0.012 + Math.random() * 0.018,
          color: color,
          gravity: 0.18
        });
      }
      if (particles.length > 420) {
        particles.splice(0, particles.length - 420);
      }
      if (!raf) loop();
    }

    function loop() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.vy += p.gravity;
        p.vx *= 0.985;
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
      }

      ctx.clearRect(0, 0, w, h);

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius * (0.35 + p.life * 0.65), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      if (particles.length > 0) {
        raf = requestAnimationFrame(loop);
      } else {
        raf = null;
        ctx.clearRect(0, 0, w, h);
      }
    }

    return {
      burst: burst,
      resize: resize,
      reset: function () {
        particles.length = 0;
        ctx.clearRect(0, 0, w, h);
      }
    };
  }
/* ══════════════════════════════════════════════════════════
     DOM REFS
     ══════════════════════════════════════════════════════════ */

  const homeScreen  = document.getElementById('homeScreen');
  const gameScreen  = document.getElementById('gameScreen');
  const homeBestEl  = document.getElementById('homeBest');
  const homeLevelEl = document.getElementById('homeLevel');

  const backBtn     = document.getElementById('backBtn');
  const modeTitleEl = document.getElementById('modeTitle');
  const boardEl     = document.getElementById('board');
  const boardWrap   = document.querySelector('.board-wrap');
  const fxCanvas    = document.getElementById('fxCanvas');
  const trayEl      = document.getElementById('tray');
  const scoreEl     = document.getElementById('score');
  const rightLabel  = document.getElementById('rightLabel');
  const rightValueEl= document.getElementById('rightValue');
  const progressBar = document.getElementById('progressBar');
  const progressEl  = document.getElementById('progressFill');
  const overlay     = document.getElementById('overlay');
  const overTitle   = document.getElementById('overTitle');
  const finalEl     = document.getElementById('finalScore');
  const restartBtn  = document.getElementById('restart');
  const homeBtn     = document.getElementById('homeBtn');

  const particles = ParticleSystem(fxCanvas);

  /* ══════════════════════════════════════════════════════════
     STATE
     ══════════════════════════════════════════════════════════ */

  const SIZE = 8;
  const GAP = 5;   // must match CSS `.board { gap }`

  let mode = null;                 // null | 'classic' | 'adventure'
  let grid = [];
  let cells = [];
  let pieces = [];
  let score = 0;
  let best = parseInt(localStorage.getItem('blockpop-best') || '0', 10) || 0;
  let level = parseInt(localStorage.getItem('blockpop-level') || '1', 10) || 1;
  let target = 0;
  let pendingLevel = null;
  let over = false;
  let busy = false;
  let drag = null;
  let trayCell = 20;

  /* ══════════════════════════════════════════════════════════
     SHAPE LIBRARY — "X" = block, "." = hole
     ══════════════════════════════════════════════════════════ */

  const SHAPES = [
    // singles & lines
    { g: ["X"],                       c: "#4ea8ff" },
    { g: ["XX"],                      c: "#4ea8ff" },
    { g: ["X", "X"],                  c: "#4ea8ff" },
    { g: ["XXX"],                     c: "#3ddc97" },
    { g: ["X", "X", "X"],             c: "#3ddc97" },
    { g: ["XXXX"],                    c: "#ffd166" },
    { g: ["X", "X", "X", "X"],        c: "#ffd166" },
    { g: ["XXXXX"],                   c: "#ff6b6b" },
    { g: ["X", "X", "X", "X", "X"],   c: "#ff6b6b" },

    // squares & rectangles
    { g: ["XX", "XX"],                c: "#c084fc" },
    { g: ["XXX", "XXX"],              c: "#f472b6" },
    { g: ["XX", "XX", "XX"],          c: "#f472b6" },

    // corners
    { g: ["X.", "XX"],                c: "#22d3ee" },
    { g: ["XX", "X."],                c: "#22d3ee" },
    { g: ["XX", ".X"],                c: "#22d3ee" },
    { g: [".X", "XX"],                c: "#22d3ee" },

    // L / J
    { g: ["X.", "X.", "XX"],          c: "#ffd166" },
    { g: [".X", ".X", "XX"],          c: "#ffd166" },
    { g: ["XX", "X.", "X."],          c: "#ffd166" },
    { g: ["XX", ".X", ".X"],          c: "#ffd166" },
    { g: ["XXX", "X.."],              c: "#3ddc97" },
    { g: ["XXX", "..X"],              c: "#3ddc97" },
    { g: ["X..", "XXX"],              c: "#3ddc97" },
    { g: ["..X", "XXX"],              c: "#3ddc97" },

    // T
    { g: ["XXX", ".X."],              c: "#c084fc" },
    { g: [".X.", "XXX"],              c: "#c084fc" },
    { g: ["X.", "XX", "X."],          c: "#c084fc" },
    { g: [".X", "XX", ".X"],          c: "#c084fc" },

    // S / Z
    { g: [".XX", "XX."],              c: "#ff6b6b" },
    { g: ["XX.", ".XX"],              c: "#ff6b6b" },
    { g: ["X.", "XX", ".X"],          c: "#fb923c" },
    { g: [".X", "XX", "X."],          c: "#fb923c" },

    // plus
    { g: [".X.", "XXX", ".X."],       c: "#22d3ee" },

    // big L / J
    { g: ["X..", "X..", "XXX"],       c: "#4ea8ff" },
    { g: ["..X", "..X", "XXX"],       c: "#4ea8ff" },
    { g: ["XXX", "X..", "X.."],       c: "#4ea8ff" },
    { g: ["XXX", "..X", "..X"],       c: "#4ea8ff" }
  ];

  /* ══════════════════════════════════════════════════════════
     PIECE SELECTION ALGORITHM
     ══════════════════════════════════════════════════════════ */

  let SHAPE_UID = 0;
  const SHAPE_DEFS = SHAPES.map(function (def) {
    const cellsArr = [];
    let cols = 0;
    for (let r = 0; r < def.g.length; r++) {
      const row = def.g[r];
      if (row.length > cols) cols = row.length;
      for (let c = 0; c < row.length; c++) {
        if (row[c] === 'X') cellsArr.push([r, c]);
      }
    }
    return {
      id: SHAPE_UID++,
      cells: cellsArr,
      rows: def.g.length,
      cols: cols,
      color: def.c,
      size: cellsArr.length
    };
  });

  function difficultyFactor() {
    if (ALGO.difficulty === 'easy') return 0.75;
    if (ALGO.difficulty === 'hard') return 1.35;
    return 1.0;
  }

  function canPlaceShape(shape, row, col) {
    const cl = shape.cells;
    for (let i = 0; i < cl.length; i++) {
      const rr = row + cl[i][0];
      const cc = col + cl[i][1];
      if (rr < 0 || rr >= SIZE || cc < 0 || cc >= SIZE) return false;
      if (grid[rr][cc]) return false;
    }
    return true;
  }

  function countPlacements(shape) {
    let count = 0;
    const maxR = SIZE - shape.rows;
    const maxC = SIZE - shape.cols;
    for (let r = 0; r <= maxR; r++) {
      for (let c = 0; c <= maxC; c++) {
        if (canPlaceShape(shape, r, c)) count++;
      }
    }
    return count;
  }

  function analyzeContext() {
    let filled = 0;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c]) filled++;
      }
    }

    const placements = new Array(SHAPE_DEFS.length);
    for (let i = 0; i < SHAPE_DEFS.length; i++) {
      placements[i] = countPlacements(SHAPE_DEFS[i]);
    }

    return {
      fillRatio: filled / (SIZE * SIZE),
      filled: filled,
      placements: placements,
      mode: mode,
      level: level,
      score: score,
      difficulty: difficultyFactor()
    };
  }

  function scoreShape(shape, ctx) {
    const placements = ctx.placements[shape.id];

    if (placements === 0) return 0.00001;

    const fill = ctx.fillRatio;
    const size = shape.size;
    const diff = ctx.difficulty;
    const sens = ALGO.boardFillSensitivity;

    let w = 1;

    const pressure = (fill - 0.35) * sens;

    if (pressure < -0.15) {
      w *= 0.55 + size * 0.5;
    } else if (pressure < 0.25) {
      w *= 0.95 + Math.min(size, 4) * 0.12;
    } else {
      w *= 2.8 / Math.pow(size, 0.65);
    }

    w *= Math.pow(placements, 0.65);

    if (diff > 1.05) {
      w *= Math.max(0.4, 1 + (size - 2.5) * 0.2 * (diff - 1));
    } else if (diff < 0.95) {
      w *= Math.max(0.4, 1 + (2.5 - size) * 0.15 * (1 - diff));
    }

    if (ctx.mode === 'adventure') {
      const lvlBoost = 1 + Math.min(ctx.level, 20) * 0.015;
      w *= Math.max(0.4, 1 + (size - 3) * 0.09 * lvlBoost);
    }

    return Math.max(0.00001, w);
  }

  function pickWeightedShape(ctx, excluded) {
    const weights = new Array(SHAPE_DEFS.length);
    let total = 0;

    for (let i = 0; i < SHAPE_DEFS.length; i++) {
      const shape = SHAPE_DEFS[i];

      if (excluded && excluded.has(shape.id)) {
        weights[i] = 0;
        continue;
      }

      const w = scoreShape(shape, ctx);
      weights[i] = w;
      total += w;
    }

    if (total <= 0) {
      return SHAPE_DEFS[(Math.random() * SHAPE_DEFS.length) | 0];
    }

    let r = Math.random() * total;
    for (let i = 0; i < weights.length; i++) {
      r -= weights[i];
      if (r <= 0) return SHAPE_DEFS[i];
    }
    return SHAPE_DEFS[SHAPE_DEFS.length - 1];
  }

  function findSafeShape(ctx) {
    let bestShape = null;
    let bestScore = Infinity;

    for (let i = 0; i < SHAPE_DEFS.length; i++) {
      const shape = SHAPE_DEFS[i];
      if (ctx.placements[shape.id] === 0) continue;

      const s = shape.size - ctx.placements[shape.id] * 0.01;
      if (s < bestScore) {
        bestScore = s;
        bestShape = shape;
      }
    }
    return bestShape;
  }

  function generatePieceSet() {
    const ctx = analyzeContext();
    const picked = [];
    const usedIds = new Set();

    for (let i = 0; i < 3; i++) {
      const shape = pickWeightedShape(
        ctx,
        ALGO.varietyPenalty ? usedIds : null
      );
      picked.push(shape);
      usedIds.add(shape.id);
    }

    if (ALGO.guaranteePlayable) {
      const anyPlayable = picked.some(function (s) {
        return ctx.placements[s.id] > 0;
      });

      if (!anyPlayable) {
        const safe = findSafeShape(ctx);
        if (safe) picked[picked.length - 1] = safe;
      }
    }

    return picked;
  }

  /* ══════════════════════════════════════════════════════════
     LEVEL DEFINITION
     ══════════════════════════════════════════════════════════ */

  function getLevelDef(n) {
    return {
      target: 600 + n * 600,
      prefill: n < 3 ? 0 : Math.min((n - 2) * 4, 24)
    };
  }

  function seededRng(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  /* ══════════════════════════════════════════════════════════
     BOARD
     ══════════════════════════════════════════════════════════ */

  function buildBoard() {
    boardEl.innerHTML = '';
    cells = [];
    for (let i = 0; i < SIZE * SIZE; i++) {
      const d = document.createElement('div');
      d.className = 'cell';
      boardEl.appendChild(d);
      cells.push(d);
    }
  }

  function renderBoard() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const el = cells[r * SIZE + c];
        const v = grid[r][c];
        el.className = v ? 'cell filled' : 'cell';
        if (v) el.style.setProperty('--c', v);
      }
    }
  }

  function canPlace(piece, row, col) {
    for (let i = 0; i < piece.cells.length; i++) {
      const rr = row + piece.cells[i][0];
      const cc = col + piece.cells[i][1];
      if (rr < 0 || rr >= SIZE || cc < 0 || cc >= SIZE) return false;
      if (grid[rr][cc]) return false;
    }
    return true;
  }

  function showPreview(row, col, piece) {
    clearPreview();
    if (row === null) return;
    for (let i = 0; i < piece.cells.length; i++) {
      const rr = row + piece.cells[i][0];
      const cc = col + piece.cells[i][1];
      if (rr < 0 || rr >= SIZE || cc < 0 || cc >= SIZE) continue;
      const el = cells[rr * SIZE + cc];
      el.classList.add('preview');
      el.style.setProperty('--pc', piece.color);
    }
  }

  function clearPreview() {
    for (let i = 0; i < cells.length; i++) cells[i].classList.remove('preview');
  }
  /* ══════════════════════════════════════════════════════════
     TRAY
     ══════════════════════════════════════════════════════════ */

  function computeSizes() {
    const bw = boardEl.getBoundingClientRect().width;
    if (bw === 0) return;
    const boardCell = (bw - (SIZE - 1) * GAP) / SIZE;

    const tw = trayEl.getBoundingClientRect().width;
    const slotW = (tw - 20) / 3;

    trayCell = Math.max(7, Math.min(boardCell * 0.56, slotW / 5.9, 24));
    particles.resize();
  }

  function buildPieceEl(piece, cell, gap) {
    const el = document.createElement('div');
    el.className = 'piece';
    el.style.gridTemplateColumns = 'repeat(' + piece.cols + ', ' + cell + 'px)';
    el.style.gridAutoRows = cell + 'px';
    el.style.gap = gap + 'px';
    el.style.setProperty('--c', piece.color);

    const occupied = new Set(piece.cells.map(function (p) { return p[0] + ',' + p[1]; }));

    for (let r = 0; r < piece.rows; r++) {
      for (let c = 0; c < piece.cols; c++) {
        const b = document.createElement('div');
        if (occupied.has(r + ',' + c)) b.className = 'b';
        el.appendChild(b);
      }
    }
    return el;
  }

  function renderTray() {
    trayEl.innerHTML = '';
    const gap = Math.max(2, Math.round(trayCell * 0.14));

    pieces.forEach(function (piece, i) {
      const slot = document.createElement('div');
      slot.className = 'slot';

      if (piece) {
        const el = buildPieceEl(piece, trayCell, gap);
        el.addEventListener('pointerdown', function (e) { onPointerDown(e, i); });
        slot.appendChild(el);
      }
      trayEl.appendChild(slot);
    });
  }

  /* ══════════════════════════════════════════════════════════
     DRAG & DROP
     ══════════════════════════════════════════════════════════ */

  function onPointerDown(e, index) {
    if (over || busy || drag) return;
    const piece = pieces[index];
    if (!piece) return;

    e.preventDefault();
    Sfx.unlock();
    Sfx.pickup();

    const srcRect = e.currentTarget.getBoundingClientRect();
    const relX = (e.clientX - srcRect.left) / srcRect.width;
    const relY = (e.clientY - srcRect.top) / srcRect.height;

    const br = boardEl.getBoundingClientRect();
    const stride = (br.width + GAP) / SIZE;
    const cell = stride - GAP;

    const w = piece.cols * stride - GAP;
    const h = piece.rows * stride - GAP;

    const ghost = document.createElement('div');
    ghost.className = 'drag-piece';
    ghost.style.gridTemplateColumns = 'repeat(' + piece.cols + ', ' + cell + 'px)';
    ghost.style.gridAutoRows = cell + 'px';
    ghost.style.gap = GAP + 'px';
    ghost.style.width = w + 'px';
    ghost.style.height = h + 'px';
    ghost.style.setProperty('--c', piece.color);

    const occupied = new Set(piece.cells.map(function (p) { return p[0] + ',' + p[1]; }));
    for (let r = 0; r < piece.rows; r++) {
      for (let c = 0; c < piece.cols; c++) {
        const b = document.createElement('div');
        if (occupied.has(r + ',' + c)) b.className = 'b';
        ghost.appendChild(b);
      }
    }
    document.body.appendChild(ghost);

    drag = {
      index: index,
      piece: piece,
      el: ghost,
      relX: relX,
      relY: relY,
      w: w,
      h: h,
      lift: e.pointerType === 'touch' ? Math.min(46, cell * 1.05) : 0,
      row: 0,
      col: 0,
      valid: false
    };

    e.currentTarget.style.visibility = 'hidden';

    moveDrag(e.clientX, e.clientY);

    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);
  }

  function moveDrag(x, y) {
    const d = drag;
    if (!d) return;

    const br = boardEl.getBoundingClientRect();
    const stride = (br.width + GAP) / SIZE;

    let left = x - d.relX * d.w;
    let top = y - d.relY * d.h - d.lift;

    const col = Math.round((left - br.left) / stride);
    const row = Math.round((top - br.top) / stride);
    const valid = canPlace(d.piece, row, col);

    if (valid) {
      left = br.left + col * stride;
      top = br.top + row * stride;
    }

    d.el.style.left = left + 'px';
    d.el.style.top = top + 'px';
    d.el.classList.toggle('locked', valid);

    d.row = row;
    d.col = col;
    d.valid = valid;

    showPreview(valid ? row : null, valid ? col : null, d.piece);
  }

  function onPointerMove(e) {
    if (!drag) return;
    moveDrag(e.clientX, e.clientY);
  }

  function onPointerUp() {
    window.removeEventListener('pointermove', onPointerMove);
    window.removeEventListener('pointerup', onPointerUp);
    window.removeEventListener('pointercancel', onPointerUp);

    if (!drag) return;

    const d = drag;
    drag = null;

    d.el.remove();
    clearPreview();

    if (d.valid) {
      placePiece(d.piece, d.row, d.col, d.index);
    } else {
      Sfx.invalid();
      renderTray();
    }
  }

  /* ══════════════════════════════════════════════════════════
     PLACING & CLEARING
     ══════════════════════════════════════════════════════════ */

  function cellCenter(r, c) {
    const br = boardEl.getBoundingClientRect();
    const stride = (br.width + GAP) / SIZE;
    const cellSize = stride - GAP;
    return {
      x: c * stride + cellSize / 2,
      y: r * stride + cellSize / 2
    };
  }

  function showScorePopup(amount) {
    const br = boardWrap.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'score-popup';
    el.textContent = '+' + amount;
    el.style.left = (br.left + br.width / 2) + 'px';
    el.style.top = (br.top + br.height / 2) + 'px';
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 1000);
  }

  function placePiece(piece, row, col, index) {
    busy = true;

    for (let i = 0; i < piece.cells.length; i++) {
      grid[row + piece.cells[i][0]][col + piece.cells[i][1]] = piece.color;
    }

    /* ── block placement score ── */
    score += piece.cells.length * SCORE.pointsPerBlock;
    pieces[index] = null;

    Sfx.place();

    renderBoard();
    renderTray();
    updateScore();

    const fullRows = [];
    const fullCols = [];

    for (let r = 0; r < SIZE; r++) {
      let full = true;
      for (let c = 0; c < SIZE; c++) if (!grid[r][c]) { full = false; break; }
      if (full) fullRows.push(r);
    }
    for (let c = 0; c < SIZE; c++) {
      let full = true;
      for (let r = 0; r < SIZE; r++) if (!grid[r][c]) { full = false; break; }
      if (full) fullCols.push(c);
    }

    const lineCount = fullRows.length + fullCols.length;

    if (lineCount === 0) {
      busy = false;
      finishTurn();
      return;
    }

    const marked = new Set();
    fullRows.forEach(function (r) {
      for (let c = 0; c < SIZE; c++) marked.add(r * SIZE + c);
    });
    fullCols.forEach(function (c) {
      for (let r = 0; r < SIZE; r++) marked.add(r * SIZE + c);
    });

    marked.forEach(function (i) { cells[i].classList.add('clearing'); });

    marked.forEach(function (i) {
      const r = Math.floor(i / SIZE);
      const c = i % SIZE;
      const pos = cellCenter(r, c);
      const color = grid[r][c] || '#ffffff';
      particles.burst(pos.x, pos.y, color, 5 + Math.floor(Math.random() * 4));
    });

    Sfx.clear(lineCount);

    setTimeout(function () {
      fullRows.forEach(function (r) {
        for (let c = 0; c < SIZE; c++) grid[r][c] = null;
      });
      fullCols.forEach(function (c) {
        for (let r = 0; r < SIZE; r++) grid[r][c] = null;
      });

      /* ── line-clear bonus ──
         1 line  →   100
         2 lines →   300
         3 lines →   600
         4 lines →  1000
         5 lines →  1500  */
      const gained =
        lineCount * SCORE.lineBase +
        lineCount * (lineCount - 1) * SCORE.lineCombo;
      score += gained;

      showScorePopup(gained);

      renderBoard();
      updateScore();
      busy = false;
      finishTurn();
    }, 240);
  }

  function finishTurn() {
    if (pieces.every(function (p) { return p === null; })) {
      pieces = generatePieceSet();
    }
    renderTray();

    if (mode === 'adventure' && score >= target) {
      endGame(true);
      return;
    }

    if (!hasMove()) endGame(false);
  }

  function hasMove() {
    for (let i = 0; i < pieces.length; i++) {
      const p = pieces[i];
      if (!p) continue;
      for (let r = 0; r <= SIZE - p.rows; r++) {
        for (let c = 0; c <= SIZE - p.cols; c++) {
          if (canPlace(p, r, c)) return true;
        }
      }
    }
    return false;
  }
  /* ══════════════════════════════════════════════════════════
     SCORE / PROGRESS
     ══════════════════════════════════════════════════════════ */

  function updateScore() {
    scoreEl.textContent = score;

    if (mode === 'classic') {
      rightValueEl.textContent = Math.max(best, score);
    } else if (progressEl) {
      const pct = target > 0 ? Math.min(100, (score / target) * 100) : 0;
      progressEl.style.width = pct + '%';
    }
  }

  /* ══════════════════════════════════════════════════════════
     GAME OVER / LEVEL END
     ══════════════════════════════════════════════════════════ */

  function endGame(win) {
    over = true;
    finalEl.textContent = score;

    if (mode === 'adventure') {
      if (win) {
        overTitle.textContent = 'Level Complete!';
        restartBtn.textContent = 'Next Level';
        pendingLevel = level + 1;
        try { localStorage.setItem('blockpop-level', String(pendingLevel)); } catch (e) {}
        Sfx.levelUp();
      } else {
        overTitle.textContent = 'Level Failed';
        restartBtn.textContent = 'Retry';
        pendingLevel = level;
        Sfx.gameOver();
      }
    } else {
      overTitle.textContent = 'Game Over';
      restartBtn.textContent = 'Play Again';
      if (score > best) {
        best = score;
        try { localStorage.setItem('blockpop-best', String(best)); } catch (e) {}
      }
      rightValueEl.textContent = best;
      Sfx.gameOver();
    }

    overlay.classList.remove('hidden');
  }

  /* ══════════════════════════════════════════════════════════
     LEVEL PREFILL (adventure)
     ══════════════════════════════════════════════════════════ */

  function placePrefill(count) {
    if (count <= 0) return;

    const rng = seededRng(level * 9871 + 12345);
    const palette = SHAPES.map(function (s) { return s.c; });
    let placed = 0;
    let attempts = 0;

    while (placed < count && attempts < 400) {
      attempts++;

      const r = Math.floor(rng() * SIZE);
      const c = Math.floor(rng() * SIZE);
      if (grid[r][c]) continue;

      const color = palette[Math.floor(rng() * palette.length)];
      grid[r][c] = color;

      let rowFull = true;
      for (let i = 0; i < SIZE; i++) if (!grid[r][i]) { rowFull = false; break; }

      let colFull = true;
      for (let i = 0; i < SIZE; i++) if (!grid[i][c]) { colFull = false; break; }

      if (rowFull || colFull) {
        grid[r][c] = null;
        continue;
      }

      placed++;
    }
  }

  /* ══════════════════════════════════════════════════════════
     RESET / START
     ══════════════════════════════════════════════════════════ */

  function reset() {
    grid = [];
    for (let r = 0; r < SIZE; r++) {
      grid.push(new Array(SIZE).fill(null));
    }

    score = 0;
    over = false;
    busy = false;
    drag = null;
    pendingLevel = null;

    if (mode === 'adventure') {
      const def = getLevelDef(level);
      target = def.target;
      placePrefill(def.prefill);

      rightLabel.textContent = 'TARGET';
      rightValueEl.textContent = target;
      modeTitleEl.textContent = 'Level ' + level;
      progressBar.classList.remove('screen-hidden');
      if (progressEl) progressEl.style.width = '0%';
    } else {
      rightLabel.textContent = 'BEST';
      rightValueEl.textContent = Math.max(best, 0);
      modeTitleEl.textContent = 'Classic';
      progressBar.classList.add('screen-hidden');
    }

    pieces = generatePieceSet();

    overlay.classList.add('hidden');
    particles.reset();

    updateScore();
    renderBoard();
    computeSizes();
    renderTray();
  }

  /* ══════════════════════════════════════════════════════════
     SCREEN NAVIGATION
     ══════════════════════════════════════════════════════════ */

  function refreshHome() {
    const b = parseInt(localStorage.getItem('blockpop-best') || '0', 10) || 0;
    const l = parseInt(localStorage.getItem('blockpop-level') || '1', 10) || 1;
    homeBestEl.textContent = 'Best Score: ' + b;
    homeLevelEl.textContent = 'Adventure Level ' + l;
  }

  function startGame(m) {
    mode = m;
    Sfx.unlock();

    homeScreen.classList.add('screen-hidden');
    gameScreen.classList.remove('screen-hidden');

    reset();

    /* recalc after layout settles */
    requestAnimationFrame(function () {
      computeSizes();
      renderTray();
      particles.resize();
    });
  }

  function goHome() {
    mode = null;
    over = true;
    drag = null;
    overlay.classList.add('hidden');
    gameScreen.classList.add('screen-hidden');
    homeScreen.classList.remove('screen-hidden');
    refreshHome();
  }

  /* ══════════════════════════════════════════════════════════
     EVENTS
     ══════════════════════════════════════════════════════════ */

  document.querySelectorAll('.menu-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      startGame(btn.dataset.mode);
    });
  });

  backBtn.addEventListener('click', goHome);
  homeBtn.addEventListener('click', goHome);

  restartBtn.addEventListener('click', function () {
    if (!mode) return;
    if (mode === 'adventure' && pendingLevel !== null) {
      level = pendingLevel;
    }
    reset();
    requestAnimationFrame(function () {
      computeSizes();
      renderTray();
      particles.resize();
    });
  });

  let resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (mode) {
        computeSizes();
        renderTray();
      }
    }, 120);
  });

  document.addEventListener('contextmenu', function (e) {
    if (e.target.closest('.app')) e.preventDefault();
  });

  document.addEventListener('touchmove', function (e) {
    if (drag) e.preventDefault();
  }, { passive: false });

  document.addEventListener('pointerdown', function () { Sfx.unlock(); }, { once: true });

  /* ══════════════════════════════════════════════════════════
     BOOT
     ══════════════════════════════════════════════════════════ */

  initBackground();
  buildBoard();
  refreshHome();

})();
</script>
</body>
</html>
